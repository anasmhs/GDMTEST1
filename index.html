<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fffaf4"><title>CODE ORANGE | GDM Clinic Showdown</title><style>
:root{--ink:#253036;--muted:#67747b;--orange:#d97933;--orange-pale:#fff1e4;--teal:#138d8b;--teal-pale:#e8f8f5;--paper:#ffffff;--line:#e6e7e7;--shadow:0 14px 40px rgba(44,49,48,.065);--bg:#fafafa}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.4}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.4}.container{max-width:1200px;padding:28px 28px 80px;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:23px}.logo{display:flex;align-items:center;gap:12px}.brandmark{display:grid;place-items:center;background:var(--orange);height:43px;width:43px;border-radius:13px;color:white;font-size:27px;font-weight:750;box-shadow:0 5px 16px #d9793333}.brand strong{font-size:17px;letter-spacing:-.03em}.brand small{display:block;font-size:11px;letter-spacing:.13em;color:var(--muted);font-weight:750;margin-top:2px}.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff;font-size:11px;font-weight:800;letter-spacing:.07em;color:var(--muted)}.btn{border-radius:11px;padding:12px 18px;font-weight:800;border:1px solid var(--line);background:white;color:var(--ink)}.btn:hover:not(:disabled){border-color:var(--orange)}.primary{background:var(--orange);color:white;border-color:var(--orange)}.primary:hover:not(:disabled){background:#b86125}.tealbtn{background:var(--teal);border-color:var(--teal);color:white}.btn.sm{padding:8px 11px;font-size:12px}.btn.big{padding:15px 25px}.card{border:1px solid var(--line);background:#fff;border-radius:19px;box-shadow:var(--shadow)}.pad{padding:27px}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:22px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.14em;color:var(--orange);text-transform:uppercase}.headline{font-size:clamp(36px,5vw,66 eight:900}.bar{height:9px;background:#edf0ef;border-radius:20px;overflow:hidden;margin-top:5px}.barfill{height:100%;border-radius:20px;background:var(--orange);transition:width .3s}.barfill.teal{background:var(--teal)}.divider{height:1px;background:var(--line);margin:16px 0}.patient{border-radius:15px;border:1px solid var(--line);background:#fff;padding:16px}.patient.highlight{border-color:#e6b18b;background:#fff9f4}.patient b{display:block;font-size:16px}.patient small{color:var(--muted)}.metric{font-weight:900;font-size:24px;letter-spacing:-.04em}.patientgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.lane{border:2px dashed #e2e5e4;background:#fcfcfc;border-radius:14px;min-height:128px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:#56636a;font-size:13px;font-weight:800}.lane.scheduled{border:2px solid #d97933;background:#fff5eb}.lane .token{font-weight:800;font-size:11px;padding:6px 8px;background:#fff;border-radius:7px;border:1px solid #e8e3df}.tag{border-radius:999px;padding:5px 9px;background:#eef1f0;font-weight:800;font-size:10px;letter-spacing:.05em}.tag.warn{color:#a65c27;background:#fff0e3}.labreport{border:1px solid #e1e5e4;border-radius:15px;padding:18px;background:#fcfdfd;max-width:600px;margin:auto}.labrows{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.test{padding:22px 12px;border:2px solid #e5e9e8;border-radius:12px;text-align:center;background:white}.test strong{display:block;font-size:35px;letter-spacing:-.06em;margin:6px 0}.test.active{border-color:var(--orange);background:var(--orange-pale)}.stamp{font-size:19px;font-weight:900;letter-spacing:-.025em;border:2px solid #dfe5e2;padding:15px;border-radius:12px;background:white;transform:rotate(-2deg)}.stamp.active{border-color:var(--orange);color:#bb6729;background:#fff5ed}.stampbar{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:16px}.pathslots{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:18px 0}.slot{min-height:84px;background:#fff9f4;border:2px dashed #edc9aa;border-radius:13px;display:flex;align-items:center;justify-content:center;text-align:center;padding:11px;font-weight:800;font-size:13px}.slot.filled{background:var(--orange-pale);border-style:solid}.blocks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.block{padding:13px;border:1px solid #dfe4e2;background:#fff;border-radius:11px;text-align:center;font-size:13px;font-weight:750}.block:disabled{background:#eee;color:#999}.monitorgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.monitor{padding:21px 12px;border:2px solid #e6eae8;background:white;border-radius:14px;text-align:center}.monitor.selected{border-color:var(--orange);background:var(--orange-pale)}.monitor strong{display:block;margin:8px 0;font-size:33px;letter-spacing:-.04em}.monitor small{color:var(--muted)}.actiongrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.action{padding:17px 10px;border:2px solid #e3e8e5;background:#fff;border-radius:12px;font-weight:800;font-size:13px}.action.active{border-color:var(--orange);background:var(--orange-pale)}.phonewrap{max-width:510px;margin:0 auto}.phone{background:white;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px}.phonemeta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:750;margin-bottom:20px}.qtitle{font-size:27px;line-height:1.1;letter-spacing:-.045em;font-weight:900;margin:10px 0}.qdesc{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 18px}.interact{border:1px solid var(--line);background:#fff;border-radius:14px;padding:15px;margin:10px 0}.selectable{cursor:pointer;transition:transform .14s,border-color .14s}.selectable:hover{border-color:#dfb28e;transform:translateY(-1px)}.selecteditem{border:2px solid var(--orange)!important;background:var(--orange-pale)!important}.triagepatients{display:grid;grid-template-columns:1fr;gap:8px}.triagepatient{display:flex;gap:12px;align-items:center;text-align:left;padding:12px;border:2px solid var(--line);background:white;border-radius:11px;width:100%}.triagepatient .letter{background:#f5f6f5;color:var(--orange);font-weight:900;border-radius:10px;padding:10px}.triagepatient b{display:block;font-size:13px}.triagepatient small{display:block;font-size:12px;color:var(--muted)}.triagelanes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.triagelane{padding:14px 8px;min-height:75px;background:#fafafa;border:2px dashed #dadfdb;border-radius:11px;font-size:12px;font-weight:800}.triagelane span{display:block;margin:4px 0;color:var(--orange)}.triagelane:active{background:var(--orange-pale)}.instr{font-size:12px;font-weight:750;color:var(--muted);margin:10px 0}.notice{font-size:12px;background:#f4f7f6;color:#56666b;padding:12px 14px;border-radius:11px}.result{background:var(--teal-pale);border:1px solid #c7e8e4;border-radius:13px;padding:17px;margin-top:17px}.result strong{font-size:18px}.result.fail{background:#fff8ee;border-color:#f2d6b7}.result p{margin:7px 0 0;font-size:13px;color:#4e5d61;line-height:1.6}.footbtn{display:flex;gap:10px;flex-wrap:wrap;margin-top:19px}.footbtn .btn{flex:1}.answerkey{background:#fcf7f1;border:1px solid #f0dfcd;border-radius:13px;padding:18px;margin:16px 0}.answerkey strong{color:#b56225}.answerkey p{font-size:14px;color:#5d6467;line-height:1.6;margin:7px 0 0}.winner{font-size:36px;font-weight:950;letter-spacing:-.05em;text-align:center;margin:20px 0}.trophy{font-size:64px;text-align:center}.field{border:1px solid #dce2df;border-radius:10px;width:100%;padding:12px 13px;background:#fff;margin:5px 0 16px}.pickteams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pickteam{padding:20px 9px;border-radius:14px;border:2px solid var(--line);background:white;font-weight:900}.pickteam.selected{border-color:var(--orange);background:var(--orange-pale)}.pickteam.teal.selected{border-color:var(--teal);background:var(--teal-pale)}.pickteam small{display:block;font-weight:500;color:var(--muted);margin:4px 0}.qrbox{margin:12px auto;text-align:center}.qrbox img{width:174px;height:174px;border:1px solid var(--line);padding:8px;border-radius:10px}.countdown{background:var(--orange-pale);padding:9px 12px;border-radius:9px;color:#a45e2f;font-weight:900}.hidden{display:none}.center{text-align:center}.itemsel{border:2px solid var(--orange)!important;background:#fff7f0!important}.livebadge{display:inline-block;background:#e9f8ee;color:#248144;padding:6px 11px;border-radius:20px;font-size:11px;font-weight:850}.quicklegend{padding:16px 0;margin-top:14px;font-size:12px;color:var(--muted)}@media(max-width:870px){.container{padding:15px 12px 70px}.hero,.board{grid-template-columns:1fr}.roundlist{grid-template-columns:repeat(2,1fr)}.boardmain{padding:19px}.headline{font-size:44px}.intro-art{min-height:230px}.patientgrid,.monitorgrid{grid-template-columns:1fr 1fr}.lanes{grid-template-columns:1fr 1fr}.scorepanel{display:grid;grid-template-columns:1fr 1fr;gap:12px}.scorepanel .card{margin:0}}@media(max-width:530px){.top{align-items:flex-start}.brand strong{font-size:14px}.tools{justify-content:flex-end}.tools .pill{display:none}.roundlist{grid-template-columns:1fr 1fr}.miniround{padding:12px}.hero{gap:12px}.pad{padding:20px}.headline{font-size:39px}.scorepanel{display:block}.boardtitle{font-size:29px}.clock{font-size:27px}.patientgrid{grid-template-columns:1fr}.phone{padding:17px}.labrows,.actiongrid{gap:8px}.test{padding:14px 7px}.test strong{font-size:29px}.stamp{font-size:15px;padding:11px 6px}.teamcount{font-size:26px}.pathslots{gap:6px}.slot{font-size:11px;padding:6px}.blocks{gap:7px}.block{padding:12px 6px;font-size:12px}}
</style></head><body><div id="app"></div><script>
// CODE ORANGE: offline playable demo + live room frontend. No external JS dependencies.
const ROUNDS=[
{title:'Triage Rush',label:'SORT THE PATIENTS',subtitle:'Three patients arrive at once. Send each to the correct pathway.',seconds:45,kind:'triage',note:'Low-risk FBS <5.1: OGTT at 22–24 weeks. Previous GDM despite normal fasting: OGTT now. FBS 5.1–6.9: GDM pathway.',answer:'Mariam → Routine OGTT | Aisha → OGTT now | Huda → GDM'},
{title:'The OGTT Decoder',label:'LAB DETECTIVE',subtitle:'Spot the abnormal result, then stamp the correct diagnosis.',seconds:35,kind:'lab',note:'Her fasting glucose is normal, but the 2-hour OGTT value is 8.8 mmol/L. The ≥8.5 mmol/L threshold makes this GDM.',answer:'Flag 2-hour glucose (8.8) → Stamp GDM'},
{title:'Build the Pathway',label:'CLINICAL SEQUENCE',subtitle:'Connect the correct three clinical steps in order.',seconds:45,kind:'path',note:'Previous GDM makes her high risk. Despite initial FBS 4.8, OGTT is done now; the 2-hour 8.7 result is diagnostic of GDM.',answer:'High-risk pathway → OGTT now → GDM diagnosis'},
{title:'RED ALERT',label:'FINAL — DOUBLE POINTS',subtitle:'One patient needs overt-diabetes evaluation and referral. Identify and act.',seconds:35,kind:'alert',note:'Noor has FBS 7.2 mmol/L: overt diabetes threshold is ≥7.0 mmol/L. Follow the overt-diabetes confirmation/evaluation and specialist referral pathway.',answer:'Select Noor (FBS 7.2) → Specialist referral / overt-diabetes pathway'}
];
const CASES=[{id:'m',name:'Mariam',text:'10 wk · FBS 4.7 · Low GDM risk',good:'routine'},{id:'a',name:'Aisha',text:'9 wk · FBS 4.8 · Previous GDM',good:'now'},{id:'h',name:'Huda',text:'12 wk · FBS 5.7',good:'gdm'}];
const LANES=[{id:'routine',name:'OGTT 22–24 weeks'},{id:'now',name:'OGTT now'},{id:'gdm',name:'GDM pathway'},{id:'overt',name:'Overt diabetes'}];
const PATHS=[{id:'routine',name:'Routine OGTT at 22–24 wk'},{id:'risk',name:'High-risk pathway'},{id:'overt',name:'Overt-diabetes referral'},{id:'now',name:'OGTT now'},{id:'gdm',name:'Diagnose GDM'},{id:'normal',name:'Normal — discharge'}];
const MONITORS=[{id:'s',name:'Salma',val:'4.9',desc:'10 weeks'}, {id:'n',name:'Noor',val:'7.2',desc:'11 weeks'}, {id:'h',name:'Hana',val:'5.7',desc:'12 weeks'}];
const ACTS=[{id:'ogtt',label:'Schedule routine OGTT'}, {id:'refer',label:'Overt diabetes referral'}, {id:'diet',label:'GDM nutrition follow-up'}];
const storage=(()=>{try{const s=localStorage;s.getItem('storageCheck');return s}catch(e){return {getItem:()=>null,setItem:()=>{}}}})();
const qs=new URLSearchParams(location.search);const offline=location.protocol==='file:'||qs.get('demo')==='1';const hostKey=qs.get('host');
let isHost=offline?qs.get('join')!=='1':!!hostKey, view=isHost?'host':'student';let room=null;let id=storage.getItem('clinicV2id')||('doc'+Math.random().toString(36).slice(2)+Date.now().toString(36));storage.setItem('clinicV2id',id);let name=storage.getItem('clinicV2name')||'', team=storage.getItem('clinicV2team')||'orange', joined=offline?false:!!storage.getItem('clinicV2joined');
let quiz={}, submitted=false, statusMsg='',lastSig='', demoResponses={}, fakeEnabled=false;
let sim={phase:'lobby',idx:0,deadline:0,scores:{orange:0,teal:0},joined:{orange:0,teal:0},submissions:{orange:0,teal:0},results:{orange:[],teal:[]},award:{},fake:false};
function fresh(){quiz={assign:{},focus:'',lab:'',stamp:'',path:[],monitor:'',action:''};submitted=false;statusMsg=''}fresh();
function safe(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function deriveScore(idx,a){if(idx===0)return Math.round(CASES.filter(c=>a.assign&&a.assign[c.id]===c.good).length/3*100);if(idx===1)return 50*(a.lab==='two'?1:0)+50*(a.stamp==='gdm'?1:0);if(idx===2)return Math.round((['risk','now','gdm'].filter((x,i)=>a.path&&a.path[i]===x).length/3)*100);return 50*(a.monitor==='n'?1:0)+50*(a.action==='refer'?1:0)}
function canSubmit(idx,a){if(idx===0)return Object.keys(a.assign||{}).length===3;if(idx===1)return !!a.lab&&!!a.stamp;if(idx===2)return (a.path||[]).length===3;return !!a.monitor&&!!a.action}
function remain(){return !room||room.phase!=='playing'?0:Math.max(0,Math.ceil(room.deadline-(offline?Date.now()/1000:(Date.now()/1000+timeShift))))}let timeShift=0;
function formatTime(n){return `0:${String(n).padStart(2,'0')}`}
function teamscore(teamName){return room.scores[teamName]||0}
function pill(t){return `<span class="pill">${t}</span>`}
function topbar(){return `<header class="top"><div class="logo"><span class="brandmark">+</span><div class="brand"><strong>CODE ORANGE</strong><small>THE GDM CLINIC SHOWDOWN</small></div></div><div class="tools">${pill(offline?'PLAYABLE DEMO':'LIVE ROOM')}${offline?`<button class="btn sm" data-action="toggle">${view==='host'?'Test student phone →':'← Host screen'}</button>`:''}</div></header>`}
function lobby(){return `<section class="hero"><div class="card pad"><div class="eyebrow">THE NEXT 6 MINUTES</div><h1 class="headline">Not a quiz.<br><span style="color:var(--orange)">A clinical shift.</span></h1><p class="lead">Two antenatal clinics. Four completely different mini-games. Every doctor helps the team make safe clinical decisions.</p><div class="stats"><span class="stat">28 doctors</span><span class="stat">2 clinics</span><span class="stat">4 interactive rounds</span><span class="stat">~6 minutes</span></div><button class="btn primary big" data-action="start">Begin clinical shift →</button><p class="tiny muted" style="margin-top:14px">${offline?'Demo includes fictional team responses; test the phone challenges with the button in the header.':'Start once your students have joined on their phones.'}</p></div><div class="card intro-art"><div><div class="eyebrow">TWO CLINICS • ONE WINNER</div><h2 style="font-size:27px;letter-spacing:-.05em;margin:10px 0 22px">Who makes the safest decisions?</h2></div><div class="teamrow"><div class="team"><div class="teamtitle">● Orange Clinic</div><div class="teamcount">${room.joined.orange}<small> / 14</small></div></div><div class="team teal"><div class="teamtitle">● Teal Clinic</div><div class="teamcount">${room.joined.teal}<small> / 14</small></div></div></div>${!offline?`<div class="qrbox"><img src="/qr.png" alt="QR for students joining"><div class="tiny">Scan this code to join</div></div>`:''}</div></section><div class="roundlist">${ROUNDS.map((r,i)=>`<div class="miniround"><span class="stepnum">0${i+1} · ${r.seconds} SEC</span><strong>${safe(r.title)}</strong><p>${['Drag/tap-to-sort patients','Inspect results + stamp','Assemble a clinical path','Select and act on red flag'][i]}</p></div>`).join('')}</div>`}
function preview(idx){if(idx===0)return `<div class="patientgrid">${CASES.map(c=>`<div class="patient"><small>NEW ARRIVAL</small><b>${c.name}</b><p class="tiny muted">${c.text}</p></div>`).join('')}</div><div class="lanes">${LANES.map(l=>`<div class="lane">${l.name}<span class="token">DROP PATIENT HERE</span></div>`).join('')}</div>`;
if(idx===1)return `<div class="labreport"><div class="row"><strong>75-g OGTT · Fatma, 24 weeks</strong><span class="tag warn">LAB RECEIVED</span></div><div class="labrows"><div class="test"><span class="tiny">Fasting</span><strong>4.6</strong><small>mmol/L</small></div><div class="test"><span class="tiny">2-hour</span><strong>8.8</strong><small>mmol/L</small></div></div><div class="stampbar"><div class="stamp center">NORMAL</div><div class="stamp center">GDM</div></div></div>`;
if(idx===2)return `<div class="patient highlight"><small>9 WEEKS · AISHA · PREVIOUS GDM</small><p><b>Initial FBS: 4.8 mmol/L</b> — subsequent OGTT 2-hour: <b>8.7 mmol/L</b></p></div><div class="pathslots"><div class="slot">STEP 1</div><div class="slot">STEP 2</div><div class="slot">STEP 3</div></div><p class="tiny muted">On their phones, students pick the correct three cards in order.</p>`;
return `<div class="monitorgrid">${MONITORS.map(c=>`<div class="monitor"><span class="tiny">${c.desc}</span><h3>${c.name}</h3><strong>${c.val}</strong><small>FBS · mmol/L</small></div>`).join('')}</div><div class="answerkey"><strong>RED ALERT PROTOCOL</strong><p>Select the patient with an overt-diabetes level glucose result, then choose the correct referral action.</p></div>`}
function sidebar(){let filled=(room.submissions?.orange||0)+(room.submissions?.teal||0);return `<aside><div class="card dashpanel"><div class="sectiontitle">LIVE CLINIC SCORES</div>${['orange','teal'].map(t=>`<div class="scoreline"><span style="font-weight:800">${t==='orange'?'● Orange':'● Teal'} Clinic</span><span class="score">${teamscore(t)}</span></div><div class="bar"><div class="barfill ${t==='teal'?'teal':''}" style="width:${Math.min(100,teamscore(t)/500*100)}%"></div></div>`).join('')}<div class="divider"></div><div class="row tiny muted"><span>Orange ${room.joined.orange}/14</span><span>Teal ${room.joined.teal}/14</span></div></div><div class="card dashpanel"><div class="sectiontitle">ROUND PARTICIPATION</div><div style="font-size:36px;font-weight:900">${filled}<span class="muted" style="font-size:16px"> / ${room.joined.orange+room.joined.teal}</span></div><p class="tiny muted">Decisions submitted on student phones.</p><div class="divider"></div><p class="tiny muted">Scoring: each clinic earns its average accuracy score, so both teams compete fairly. The final round scores ×2.</p>${offline?`<button class="btn" style="width:100%" data-action="simulate">Simulate 28 doctors</button>`:room.joined.orange+room.joined.teal===0?`<button class="btn" style="width:100%" data-action="simulate">Demo: simulate 28 doctors</button>`:''}</div></aside>`}
function board(){let r=ROUNDS[room.idx],reveal=room.phase==='reveal';return `<div class="board"><main class="card boardmain"><div class="boardhead"><div><div class="eyebrow">ROUND ${room.idx+1} / 4 · ${safe(r.label)}</div><h1 class="boardtitle">${safe(r.title)}</h1></div><div class="clock" id="clock">${formatTime(remain())}</div></div><p class="subtitle">${safe(r.subtitle)}</p>${preview(room.idx)}${reveal?`<div class="answerkey"><strong>✓ ${safe(r.answer)}</strong><p>${safe(r.note)}</p></div>`:''}<div class="footbtn">${room.phase==='playing'?`<button class="btn primary" data-action="reveal">Close round + reveal →</button><button class="btn" data-action="test">Try the mini-game yourself</button>`:`<button class="btn primary" data-action="next">${room.idx===3?'Declare the winner →':'Next challenge →'}</button>`}</div><div class="quicklegend">${reveal?'The result shown above is the key clinical learning point.':'Students are working on a different interactive puzzle on their phones — not selecting A/B/C/D.'}</div></main>${sidebar()}</div>`}
function finalPage(){let a=room.scores.orange,b=room.scores.teal,w=a===b?'A clinical tie!':a>b?'ORANGE CLINIC WINS!':'TEAL CLINIC WINS!';return `<div class="card pad center"><div class="eyebrow">CLINICAL SHIFT COMPLETE</div><div class="trophy">🏆</div><div class="winner">${w}</div><p class="muted">The safest clinical decisions win — not just the fastest taps.</p><div class="teamrow" style="max-width:560px;margin:25px auto"><div class="team"><b>Orange Clinic</b><div class="teamcount">${a}</div></div><div class="team teal"><b>Teal Clinic</b><div class="teamcount">${b}</div></div></div><div class="answerkey" style="max-width:680px;margin:20px auto;text-align:left"><strong>Remember the three key cut-offs</strong><p>Initial FBS ≥5.1 mmol/L (and <7.0): GDM. OGTT fasting ≥5.1 or 2-hour ≥8.5: GDM. FBS ≥7.0: evaluate as overt diabetes and refer appropriately.</p></div><button class="btn primary" data-action="reset">Play again ↺</button></div>`}
function gameHost(){return room.phase==='lobby'?lobby():room.phase==='finished'?finalPage():board()}
function triageInteract(){return `<div class="instr">1. Tap a patient. 2. Tap the destination pathway. Repeat for all three.</div><div class="triagepatients">${CASES.map(c=>`<button class="triagepatient selectable ${quiz.focus===c.id?'selecteditem':''}" draggable="true" data-drag="${c.id}" data-action="pickcase" data-id="${c.id}"><span class="letter">${c.name.charAt(0)}</span><span><b>${c.name}</b><small>${safe(c.text)}</small><small style="font-weight:850;color:var(--orange)">${quiz.assign[c.id]?`Assigned: ${LANES.find(l=>l.id===quiz.assign[c.id]).name}`:'Not assigned'}</small></span></button>`).join('')}</div><div class="instr">Send selected patient to:</div><div class="triagelanes">${LANES.map(l=>`<button class="triagelane selectable" data-action="putcase" data-id="${l.id}">${l.name}<span>${Object.entries(quiz.assign).filter(([k,v])=>v===l.id).map(([k])=>CASES.find(c=>c.id===k)?.name).join(', ')||'Tap to place'}</span></button>`).join('')}</div>`}
function labInteract(){return `<div class="notice"><strong>Fatma, 24 weeks</strong> · 75-g oral glucose tolerance test</div><div class="instr">Tap the result that meets the GDM diagnostic threshold.</div><div class="labrows"><button class="test selectable ${quiz.lab==='fast'?'selecteditem':''}" data-action="lab" data-id="fast"><span class="tiny">Fasting glucose</span><strong>4.6</strong><small>mmol/L</small></button><button class="test selectable ${quiz.lab==='two'?'selecteditem':''}" data-action="lab" data-id="two"><span class="tiny">2-hour glucose</span><strong>8.8</strong><small>mmol/L</small></button></div><div class="instr">Stamp the report:</div><div class="stampbar"><button class="stamp selectable ${quiz.stamp==='normal'?'selecteditem':''}" data-action="stamp" data-id="normal">NORMAL</button><button class="stamp selectable ${quiz.stamp==='gdm'?'selecteditem':''}" data-action="stamp" data-id="gdm">GDM</button></div>`}
function pathInteract(){return `<div class="notice"><b>Aisha, 9 weeks.</b> Previous GDM. Initial FBS <b>4.8 mmol/L</b>. The OGTT's 2-hour result is <b>8.7 mmol/L</b>.</div><div class="instr">Select three steps in their clinical order. Tap a filled slot to remove it.</div><div class="pathslots">${[0,1,2].map(i=>`<button class="slot ${quiz.path[i]?'filled':''}" data-action="removepath" data-id="${i}">${quiz.path[i]?`${i+1}. ${PATHS.find(p=>p.id===quiz.path[i]).name}`:`STEP ${i+1}`}</button>`).join('')}</div><div class="blocks">${PATHS.map(p=>`<button class="block selectable" ${quiz.path.includes(p.id)?'disabled':''} data-action="addpath" data-id="${p.id}">${p.name}</button>`).join('')}</div>`}
function alertInteract(){return `<div class="instr">Tap the patient who needs the overt-diabetes pathway.</div><div class="monitorgrid">${MONITORS.map(m=>`<button class="monitor selectable ${quiz.monitor===m.id?'selecteditem':''}" data-action="monitor" data-id="${m.id}"><small>${m.desc}</small><b style="display:block;margin-top:8px">${m.name}</b><strong>${m.val}</strong><small>FBS mmol/L</small></button>`).join('')}</div><div class="instr">Choose the safest next action.</div><div class="actiongrid">${ACTS.map(a=>`<button class="action selectable ${quiz.action===a.id?'selecteditem':''}" data-action="action" data-id="${a.id}">${a.label}</button>`).join('')}</div>`}
function joining(){return `<div class="card phone"><div class="eyebrow">CHECK INTO THE CLINIC</div><h1 class="qtitle">Every doctor counts.</h1><p class="qdesc">Choose your team and join from your phone. No app download or account required.</p><label class="tiny"><b>Your name</b></label><input id="joinName" class="field" maxlength="28" placeholder="Dr. your name" value="${safe(name)}"><div class="pickteams"><button class="pickteam ${team==='orange'?'selected':''}" data-action="team" data-id="orange">● Orange Clinic<small>${room.joined.orange}/14 joined</small></button><button class="pickteam teal ${team==='teal'?'selected':''}" data-action="team" data-id="teal">● Teal Clinic<small>${room.joined.teal}/14 joined</small></button></div>${statusMsg?`<p style="color:#aa5231;font-size:13px">${safe(statusMsg)}</p>`:''}<button class="btn primary" style="width:100%;margin-top:16px" data-action="join">Check in →</button></div>`}
function student(){let r=ROUNDS[room.idx];return `<div class="phonewrap"><div style="margin:25px 0 15px"><div class="eyebrow">DOCTOR'S WORKSTATION</div><h1 class="qtitle">${!joined?'Join your clinic':room.phase==='lobby'?"You're on call!":room.phase==='finished'?'Shift complete':r.title}</h1><p class="qdesc">${!joined?'One clinic. One team. Every decision matters.':room.phase==='lobby'?'Look at the projector — your host will start the first case.':room.phase==='finished'?'Your clinical decisions helped your whole team.':r.subtitle}</p></div>${!joined?joining():`<section class="phone"><div class="phonemeta"><span>${team==='orange'?'🟠 ORANGE':'🔵 TEAL'} CLINIC · ${safe(name)}</span><span>${room.phase==='playing'?`<span id="phoneClock" class="countdown">${formatTime(remain())}</span>`:`ROUND ${room.idx+1} / 4`}</span></div>${room.phase==='lobby'?`<div class="center" style="padding:50px 0"><div style="font-size:54px">✚</div><h2>Checked in!</h2><p class="muted">Waiting for patients to arrive.</p></div>`:room.phase==='finished'?`<div class="center"><div class="trophy">🏆</div><h2>${room.scores.orange===room.scores.teal?'A tie!':room.scores.orange>room.scores.teal?'Orange Clinic wins!':'Teal Clinic wins!'}</h2><p>Orange ${room.scores.orange} • Teal ${room.scores.teal}</p></div>`:room.phase==='reveal'?`<div class="result"><strong>Clinical answer revealed</strong><p><b>${safe(r.answer)}</b></p><p>${safe(r.note)}</p></div>`:submitted?`<div class="result"><strong>✓ Clinical decisions locked</strong><p>Your case is submitted. Look at the projector for the team reveal!</p></div>`:`${r.kind==='triage'?triageInteract():r.kind==='lab'?labInteract():r.kind==='path'?pathInteract():alertInteract()}<div class="footbtn"><button class="btn primary" style="width:100%" data-action="submit" ${canSubmit(room.idx,quiz)&&remain()>0?'':'disabled'}>Submit clinical decision →</button></div>`}</section>`}${offline?`<div class="footbtn"><button class="btn" data-action="toggle">← Return to projected host screen</button></div>`:''}</div>`}
function simState(){return {phase:sim.phase,idx:sim.idx,deadline:sim.deadline,scores:{...sim.scores},joined:{...sim.joined},submissions:{...sim.submissions},award:sim.award}}
function fillDemo(){sim.joined={orange:14,teal:14};sim.fake=true;fakeEnabled=true;let targets=[[12,9],[8,12],[11,9],[9,12]][sim.idx];for(let [i,t] of ['orange','teal'].entries()){let arr=Array.from({length:14},(_,j)=>j<targets[i]?100:j%2===0?50:0);sim.results[t]=arr;sim.submissions[t]=14}}
function finishRound(){if(sim.phase!=='playing')return;for(const t of ['orange','teal']){let arr=sim.results[t];sim.award[t]=arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length*(sim.idx===3?2:1)):0;sim.scores[t]+=sim.award[t]}sim.phase='reveal'}
function simAction(a){if(a==='start'&&sim.phase==='lobby'){sim.phase='playing';sim.deadline=Date.now()/1000+ROUNDS[0].seconds;fakeEnabled=false;}else if(a==='simulate'&&sim.phase==='playing'){fillDemo()}else if(a==='reveal')finishRound();else if(a==='next'&&sim.phase==='reveal'){if(sim.idx===3){sim.phase='finished'}else{sim.idx++;sim.phase='playing';sim.deadline=Date.now()/1000+ROUNDS[sim.idx].seconds;sim.submissions={orange:0,teal:0};sim.results={orange:[],teal:[]};if(sim.fake)fillDemo()}}else if(a==='reset'){sim={phase:'lobby',idx:0,deadline:0,scores:{orange:0,teal:0},joined:{orange:0,teal:0},submissions:{orange:0,teal:0},results:{orange:[],teal:[]},award:{},fake:false};joined=false;fresh()}room=simState();render(true)}
async function serverAction(a){let res=await fetch('/api/host',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:hostKey,action:a})});let json=await res.json();if(!res.ok)throw Error(json.error||'Server error');room=json;render(true)}
async function joinGame(){const n=document.getElementById('joinName')?.value.trim();if(!n){statusMsg='Please enter your name.';render(true);return}name=n;if(offline){joined=true;sim.joined[team]++;room=simState();render(true);return}try{const res=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,name,team})});const data=await res.json();if(!res.ok)throw Error(data.error);joined=true;team=data.team;storage.setItem('clinicV2joined','yes');storage.setItem('clinicV2name',name);storage.setItem('clinicV2team',team);await poll();render(true)}catch(e){statusMsg=e.message;render(true)}}
async function submitGame(){if(!canSubmit(room.idx,quiz)||submitted||remain()===0)return;let score=deriveScore(room.idx,quiz);if(offline){sim.results[team].push(score);sim.submissions[team]++;submitted=true;room=simState();render(true);return}try{let res=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,idx:room.idx,answers:quiz})});let data=await res.json();if(!res.ok)throw Error(data.error);submitted=true;render(true)}catch(e){statusMsg=e.message;alert(e.message)}}
function render(force=false){if(!room)return;let sig=JSON.stringify([view,room.phase,room.idx,room.scores,room.joined,room.submissions,quiz,submitted,team,name,joined,statusMsg]);if(!force&&sig===lastSig)return;lastSig=sig;document.getElementById('app').innerHTML=`<div class="container">${topbar()}${view==='host'?gameHost():student()}</div>`}
async function poll(){if(offline){room=simState();render();return}try{let res=await fetch('/api/state',{cache:'no-store'});let freshRoom=await res.json();timeShift=freshRoom.serverNow-Date.now()/1000;if(room&&room.idx!==freshRoom.idx){fresh();}room=freshRoom;render()}catch(e){}}
const app=document.getElementById('app');document.addEventListener('click',async(e)=>{let btn=e.target.closest('[data-action]');if(!btn)return;let a=btn.dataset.action,v=btn.dataset.id;if(a==='toggle'){view=view==='host'?'student':'host';if(view==='student'&&!joined&&offline){joined=true;name='Demo doctor';sim.joined.orange=Math.max(1,sim.joined.orange);room=simState()}render(true);return}if(a==='test'){view='student';if(!joined&&offline){joined=true;name='Demo doctor';sim.joined.orange=Math.max(1,sim.joined.orange);room=simState()}fresh();render(true);return}if(a==='team'){team=v;render(true);return}if(a==='join')return joinGame();if(a==='pickcase'){quiz.focus=v;render(true);return}if(a==='putcase'){if(quiz.focus){quiz.assign[quiz.focus]=v;quiz.focus='';render(true)}return}if(a==='lab'||a==='stamp'||a==='monitor'||a==='action'){quiz[a]=v;render(true);return}if(a==='addpath'){if(quiz.path.length<3&&!quiz.path.includes(v)){quiz.path.push(v);render(true)}return}if(a==='removepath'){quiz.path.splice(Number(v),1);render(true);return}if(a==='submit')return submitGame();if(['start','simulate','reveal','next','reset'].includes(a)){try{offline?simAction(a):await serverAction(a);if(a==='next'){fresh();render(true)}}catch(e){alert(e.message)}return}});
// Drag/drop is a desktop convenience; tapping works on all phones.
document.addEventListener('dragstart',e=>{let el=e.target.closest('[data-drag]');if(el){e.dataTransfer.setData('text/plain',el.dataset.drag)}});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-action="putcase"]'))e.preventDefault()});
document.addEventListener('drop',e=>{let el=e.target.closest('[data-action="putcase"]');if(el){e.preventDefault();let pid=e.dataTransfer.getData('text/plain');if(CASES.some(c=>c.id===pid)){quiz.assign[pid]=el.dataset.id;quiz.focus='';render(true)}}});
// Offline host acts as simulator; live host actions require the secret host URL.
if(offline){room=simState();render(true)}else{poll();setInterval(poll,950)}setInterval(()=>{if(!room)return;let clock=document.getElementById('clock'),p=document.getElementById('phoneClock'),txt=formatTime(remain());if(clock)clock.textContent=txt;if(p)p.textContent=txt;if(remain()===0&&room.phase==='playing'&&view==='student'&&!submitted){let b=document.querySelector('[data-action="submit"]');if(b)b.disabled=true}},300);
</script></body></html>
